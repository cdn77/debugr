name: ci
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@master
        with:
          node-version: '24'
      - name: Upgrade NPM
        run: npm i -g npm
      - name: Checkout repository
        uses: actions/checkout@master
      - name: Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Lint packages
        run: npm run lint
      - name: Publish packages to NPM
        run: npm run release -- --yes
